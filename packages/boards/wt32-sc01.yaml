# ESP Screens - WT32-SC01 V3.2
# Original ESP32-WROVER-B, ST7796 display and FT6336 capacitive touch.

packages:
  build: !include ../hardware/esp-idf.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  # backlight: !include ../features/backlight.yaml
  # self_test: !include ../features/self-test.yaml

substitutions:
  BOARD_ID: "wt32sc01"
  DEVICE_NAME: "wt32-sc01-v32"
  DEVICE_FRIENDLY_NAME: "WT32-SC01 V3.2"

  PANEL_W: "320"
  PANEL_H: "480"
  DISPLAY_DPI: "165.000"

  ROTATION_LANDSCAPE: "90"

  GRID_COLS: "2"
  GRID_ROWS: "2"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "3"

  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"
  LVGL_BUFFER_SIZE: "12%"

  BACKLIGHT_FREQUENCY: "20000Hz"

# Original ESP32-WROVER-B
esp32:
  board: esp-wrover-kit
  variant: esp32
  flash_size: 4MB
  cpu_frequency: 240MHz

# WROVER-B uses quad PSRAM, not octal PSRAM.
psram:
  mode: quad
  speed: 40MHz

# Display SPI bus
spi:
  id: lcd
  clk_pin: GPIO14
  mosi_pin: GPIO13

# Touch controller I2C bus
i2c:
  id: touch_bus
  sda: GPIO18
  scl: GPIO19
  scan: true
  frequency: 400kHz

# WT32-SC01 has no TCA9554 display GPIO expander.
# Display CS and reset are connected directly to ESP32 GPIOs.

output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# Capacitive touchscreen
touchscreen:
  - platform: ft63x6
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    update_interval: 20ms

# ST7796/ST7796S SPI display
display:
  - platform: mipi_spi
    id: my_display
    model: ST7796
    spi_id: lcd
    dimensions:
      width: 320
      height: 480
    color_order: bgr
    invert_colors: false
    dc_pin: GPIO21
    cs_pin: GPIO15
    reset_pin: GPIO22
    spi_mode: 1
    data_rate: 20MHz
    update_interval: never
    auto_clear_enabled: false
